<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A clean, modern, and responsive calculator built with vanilla HTML, CSS, and JavaScript.">
    <title>Modern Calculator</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="calculator-wrapper">
        <div class="calculator" role="region" aria-label="Calculator">
            
            <!-- Top Controls Bar: Theme Switcher & History Toggle -->
            <header class="calculator-header">
                <span class="calculator-brand">CALC</span>
                <div class="header-actions">
                    <button type="button" class="icon-btn" id="historyToggleBtn" aria-label="Toggle calculation history" title="View History">
                        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </button>
                    <button type="button" class="icon-btn" id="themeToggleBtn" aria-label="Switch between light and dark theme" title="Toggle Theme">
                        <span id="themeIcon">☀️</span>
                    </button>
                </div>
            </header>

            <!-- Slide-down Calculation History Drawer -->
            <section class="history-panel" id="historyPanel" aria-hidden="true">
                <div class="history-header">
                    <h3>Calculation History</h3>
                    <button type="button" class="btn-text" id="clearHistoryBtn">Clear</button>
                </div>
                <ul class="history-list" id="historyList">
                    <li class="history-empty">No calculations yet</li>
                </ul>
            </section>

            <!-- Calculator Display: Previous operand & current operand -->
            <div class="display" aria-live="polite">
                <div class="previous-operand" id="previousOperand" data-previous-operand></div>
                <div class="current-operand" id="currentOperand" data-current-operand>0</div>
            </div>

            <!-- Keypad: Perfectly Balanced 5x4 CSS Grid -->
            <div class="keypad">
                <!-- Row 1 -->
                <button type="button" class="btn btn-function" data-action="clear" aria-label="Clear all">AC</button>
                <button type="button" class="btn btn-function" data-action="delete" aria-label="Delete last digit">DEL</button>
                <button type="button" class="btn btn-function" data-action="percent" aria-label="Percentage">%</button>
                <button type="button" class="btn btn-operator" data-operation="÷" aria-label="Divide">÷</button>

                <!-- Row 2 -->
                <button type="button" class="btn btn-number" data-number="7">7</button>
                <button type="button" class="btn btn-number" data-number="8">8</button>
                <button type="button" class="btn btn-number" data-number="9">9</button>
                <button type="button" class="btn btn-operator" data-operation="×" aria-label="Multiply">×</button>

                <!-- Row 3 -->
                <button type="button" class="btn btn-number" data-number="4">4</button>
                <button type="button" class="btn btn-number" data-number="5">5</button>
                <button type="button" class="btn btn-number" data-number="6">6</button>
                <button type="button" class="btn btn-operator" data-operation="-" aria-label="Subtract">−</button>

                <!-- Row 4 -->
                <button type="button" class="btn btn-number" data-number="1">1</button>
                <button type="button" class="btn btn-number" data-number="2">2</button>
                <button type="button" class="btn btn-number" data-number="3">3</button>
                <button type="button" class="btn btn-operator" data-operation="+" aria-label="Add">+</button>

                <!-- Row 5 -->
                <button type="button" class="btn btn-number" data-action="toggle-sign" aria-label="Toggle positive or negative">±</button>
                <button type="button" class="btn btn-number" data-number="0">0</button>
                <button type="button" class="btn btn-number" data-action="decimal" aria-label="Decimal point">.</button>
                <button type="button" class="btn btn-equals" data-action="equals" aria-label="Calculate equals">=</button>
            </div>
        </div>
    </main>

    <!-- External JavaScript: loaded with defer so DOM is fully parsed -->
    <script src="js/script.js" defer></script>
</body>
</html>
